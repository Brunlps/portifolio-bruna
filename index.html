<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema antes do React carregar, evitando o flash de tela clara
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <title>Bruna Lopes | Desenvolvedora Full Stack Júnior</title>
    <meta
      name="description"
      content="Portfólio de Bruna Lopes, desenvolvedora full stack júnior com Python, FastAPI, Java, Spring Boot e React. Disponível para vagas e projetos freelance."
    />

    <!-- Prévia ao compartilhar o link (LinkedIn, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://portifolio-bruna.onrender.com" />
    <meta property="og:title" content="Bruna Lopes | Desenvolvedora Full Stack Júnior" />
    <meta
      property="og:description"
      content="Portfólio de Bruna Lopes, desenvolvedora full stack júnior com Python, FastAPI, Java, Spring Boot e React. Disponível para vagas e projetos freelance."
    />
    <meta property="og:image" content="https://portifolio-bruna.onrender.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
